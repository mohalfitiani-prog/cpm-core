name: Flutter Android checks and APK
on:
  push:
    branches: [flutter-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix functions --ignore-scripts
      - run: npm test --prefix functions
      - run: node tools/smoke-functions.mjs
      - run: bash tools/bootstrap_android.sh
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter analyze
        working-directory: flutter_app
      - run: flutter test
        working-directory: flutter_app
      - run: flutter build apk --debug
        working-directory: flutter_app
      - uses: actions/upload-artifact@v4
        with:
          name: cpm-core-android-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
